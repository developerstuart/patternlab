<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script>
      (function () {
        var m = localStorage.getItem("pl-mode");
        if (
          m === "dark" ||
          (m == null && matchMedia("(prefers-color-scheme:dark)").matches)
        )
          document.documentElement.setAttribute("data-mode", "dark");
      })();
    </script>
    <style>
      __INDEX_CSS__
    </style>
  </head>
  <body>
    <header>
      <button
        class="icon-btn nav-toggle"
        id="nav-toggle"
        aria-label="Toggle navigation"
        title="Toggle navigation"
      >
        ☰
      </button>
      <h1>__HEADER_TITLE__ <span class="version">__HEADER_VERSION__</span></h1>
      <span class="count">__TOTAL_COUNT__ component__TOTAL_SUFFIX__</span>
      <div class="spacer"></div>
      <div id="pl-toggles"></div>
      <div class="popover" id="display-menu" style="display: none">
        <button
          class="icon-btn"
          id="display-toggle"
          aria-haspopup="true"
          aria-expanded="false"
          title="Display options"
        >
          ⚙ <span class="btn-label">Display</span>
        </button>
        <div class="popover-panel" id="display-panel"></div>
      </div>
      <button class="icon-btn" id="mode-btn" aria-label="Toggle dark mode">
        🌙 <span class="btn-label">Dark</span>
      </button>
    </header>

    <aside>
      <nav aria-label="Components">
        <ul class="tree" id="tree-root"></ul>
      </nav>
    </aside>

    <main>
      <div class="main-toolbar">
        <div class="toolbar-row">
          <div class="breadcrumb-wrap">
            <span id="breadcrumb" class="breadcrumb"></span>
            <div class="popover breadcrumb-menu" id="breadcrumb-menu">
              <button
                class="breadcrumb-trigger"
                id="breadcrumb-trigger"
                aria-haspopup="true"
                aria-expanded="false"
                title="Breadcrumb"
              >
                <span id="breadcrumb-current">Home</span>
                <span class="vp-caret" aria-hidden="true">▾</span>
              </button>
              <div class="popover-panel" id="breadcrumb-panel"></div>
            </div>
          </div>
          <div class="spacer"></div>
          <div class="toolbar-controls">
            <div class="viewport-group popover" id="viewport-group" style="display: none">
              <button
                class="icon-btn viewport-trigger"
                id="viewport-trigger"
                aria-haspopup="true"
                aria-expanded="false"
                title="Viewport size"
              >
                <svg class="vp-icon" viewBox="0 0 16 16" aria-hidden="true">
                  <rect x="1.5" y="2.5" width="13" height="8.5" rx="1.2" />
                  <path d="M5.5 14h5M8 11v3" />
                </svg>
                <span id="viewport-trigger-label">Full</span>
                <span class="vp-caret" aria-hidden="true">▾</span>
              </button>
              <div class="viewport-panel" id="viewport-panel">
                <div
                  class="seg viewport-tools"
                  id="viewport-tools"
                  role="group"
                  aria-label="Viewport size"
                >
                  <button class="seg-btn" data-size="full">Full</button>
                  <button class="seg-btn" data-size="desktop">Desktop</button>
                  <button class="seg-btn" data-size="tablet">Tablet</button>
                  <button class="seg-btn" data-size="mobile">Mobile</button>
                  <button class="seg-btn" data-size="custom">Custom</button>
                </div>
                <select
                  id="vp-preset"
                  class="vp-select vp-preset"
                  aria-label="Viewport preset"
                >
                  <option value="full">Full</option>
                  <option value="desktop">Desktop</option>
                  <option value="tablet">Tablet</option>
                  <option value="mobile">Mobile</option>
                  <option value="custom">Custom</option>
                </select>
                <div class="viewport-size" id="viewport-size">
                  <input
                    id="vp-w"
                    class="vp-input"
                    type="number"
                    min="1"
                    step="1"
                    aria-label="Viewport width (px)"
                    title="Viewport width (px)"
                  />
                  <span class="vp-x" aria-hidden="true">×</span>
                  <input
                    id="vp-h"
                    class="vp-input"
                    type="number"
                    min="1"
                    step="1"
                    aria-label="Viewport height (px)"
                    title="Viewport height (px)"
                  />
                  <select
                    id="vp-zoom"
                    class="vp-select"
                    aria-label="Zoom level"
                    title="Zoom level (levels too large to fit are disabled)"
                  ></select>
                </div>
                <button
                  class="icon-btn"
                  id="full-btn"
                  title="Open full size in new tab"
                >
                  ↗ <span class="btn-label">Full</span>
                </button>
              </div>
            </div>
            <div
              class="seg view-toggle"
              id="view-toggle"
              role="group"
              aria-label="View mode"
              style="display: none"
            >
              <button class="seg-btn active" data-view="preview">Preview</button>
              <button class="seg-btn" data-view="code">Code</button>
            </div>
          </div>
        </div>
        <div
          class="toolbar-row toolbar-row--variants"
          id="variant-row"
          style="display: none"
        >
          <div class="variant-bar" id="variant-bar">
            <button
              class="variant-scroll"
              id="variant-scroll-left"
              aria-label="Scroll variations left"
              tabindex="-1"
            >
              ‹
            </button>
            <nav
              id="variant-tabs"
              class="variant-tabs"
              aria-label="Variations"
            ></nav>
            <button
              class="variant-scroll"
              id="variant-scroll-right"
              aria-label="Scroll variations right"
              tabindex="-1"
            >
              ›
            </button>
          </div>
        </div>
      </div>
      <div class="main-content">
        <div id="preview-host" style="display: none">
          <div id="preview-shell">
            <iframe id="preview-frame" title="Component preview"></iframe>
            <div
              class="resize-handle handle-right"
              data-resize="right"
              aria-hidden="true"
            ></div>
            <div
              class="resize-handle handle-bottom"
              data-resize="bottom"
              aria-hidden="true"
            ></div>
            <div
              class="resize-handle handle-corner"
              data-resize="corner"
              aria-hidden="true"
            ></div>
          </div>
        </div>
        <div id="home-view" style="display: none"></div>
        <div id="folder-view" style="display: none"></div>
        <div id="code-view" style="display: none"></div>
        <div class="empty" id="empty-msg">← Select a component or folder</div>
      </div>
    </main>

    __HIGHLIGHTER__
    <script>
      __INDEX_JS__;
    </script>
  </body>
</html>
