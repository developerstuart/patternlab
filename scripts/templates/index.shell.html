<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__PAGE_TITLE__</title>
    <script>
      (function () {
        var m = localStorage.getItem("pl-mode");
        if (
          m === "dark" ||
          (m == null && matchMedia("(prefers-color-scheme:dark)").matches)
        )
          document.documentElement.setAttribute("data-mode", "dark");
      })();
    </script>
    <style>
      __INDEX_CSS__
    </style>
  </head>
  <body>
    <header>
      <h1>__HEADER_TITLE__ <span class="version">__HEADER_VERSION__</span></h1>
      <span class="count">__TOTAL_COUNT__ component__TOTAL_SUFFIX__</span>
      <div
        class="seg viewport-tools"
        id="viewport-tools"
        role="group"
        aria-label="Viewport size"
        style="display: none"
      >
        <button class="seg-btn" data-size="full">Full</button>
        <button class="seg-btn" data-size="desktop">Desktop</button>
        <button class="seg-btn" data-size="tablet">Tablet</button>
        <button class="seg-btn" data-size="mobile">Mobile</button>
      </div>
      <div class="spacer"></div>
      <div id="pl-toggles"></div>
      <button class="icon-btn" id="mode-btn" aria-label="Toggle dark mode">
        🌙 Dark
      </button>
    </header>

    <aside>
      <nav aria-label="Components">
        <ul class="tree" id="tree-root"></ul>
      </nav>
    </aside>

    <main>
      <div class="main-toolbar">
        <div class="toolbar-row">
          <span id="breadcrumb" class="breadcrumb"></span>
          <div class="spacer"></div>
          <div class="toolbar-controls">
            <div
              class="seg view-toggle"
              id="view-toggle"
              role="group"
              aria-label="View mode"
              style="display: none"
            >
              <button class="seg-btn active" data-view="preview">Preview</button>
              <button class="seg-btn" data-view="code">Code</button>
            </div>
            <button
              class="icon-btn"
              id="full-btn"
              style="display: none"
              title="Open in new tab"
            >
              ↗ Full
            </button>
          </div>
        </div>
        <div class="variant-bar" id="variant-bar" style="display: none">
          <button
            class="variant-scroll"
            id="variant-scroll-left"
            aria-label="Scroll variations left"
            tabindex="-1"
          >
            ‹
          </button>
          <nav
            id="variant-tabs"
            class="variant-tabs"
            aria-label="Variations"
          ></nav>
          <button
            class="variant-scroll"
            id="variant-scroll-right"
            aria-label="Scroll variations right"
            tabindex="-1"
          >
            ›
          </button>
        </div>
      </div>
      <div class="main-content">
        <div id="preview-host" style="display: none">
          <div id="preview-shell">
            <iframe id="preview-frame" title="Component preview"></iframe>
            <div
              class="resize-handle handle-right"
              data-resize="right"
              aria-hidden="true"
            ></div>
            <div
              class="resize-handle handle-bottom"
              data-resize="bottom"
              aria-hidden="true"
            ></div>
            <div
              class="resize-handle handle-corner"
              data-resize="corner"
              aria-hidden="true"
            ></div>
          </div>
        </div>
        <div id="home-view" style="display: none"></div>
        <div id="folder-view" style="display: none"></div>
        <div id="code-view" style="display: none"></div>
        <div class="empty" id="empty-msg">← Select a component or folder</div>
      </div>
    </main>

    __HIGHLIGHTER__
    <script>
      __INDEX_JS__;
    </script>
  </body>
</html>
